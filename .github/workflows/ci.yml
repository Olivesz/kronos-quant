name: gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff check
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.5"
          ruff check .

  real-data:
    name: Gates on real prices (committed snapshot)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (no market-data client)
        # Every real-data gate reads live/genesis/*.csv.gz, verified against
        # data/pinned_manifest.json. Removing yfinance proves no gate and no
        # headline number depends on a live feed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip uninstall -y yfinance

      - name: Run all verification gates on real prices (any SKIPPED fails)
        run: python tests/run_all.py

      - name: Headline pipeline on the committed real-price snapshot
        run: |
          echo "REAL prices: live/genesis snapshot — this is the README headline run"
          python run_kronos.py

  hermetic:
    name: Gates on a synthetic market (hermetic)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Seeded synthetic market: every estimator gate checks size and power
      # against known ground truth. Real-market assertions are skipped here
      # and listed by run_all.py; the real-data job runs all of them.
      KRONOS_SYNTHETIC: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run all verification gates on the synthetic market
        run: python tests/run_all.py

      - name: Smoke-test the pipeline on the SYNTHETIC market (not the headline)
        run: |
          echo "SYNTHETIC market — not the headline"
          python run_kronos.py
