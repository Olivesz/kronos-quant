name: paper-account

# DESIGN29 Stage 4: trade the shipped overlay on SPY in the owner's broker
# paper account. Dormant until the owner adds the repository secrets
# ALPACA_PAPER_KEY_ID and ALPACA_PAPER_SECRET_KEY; run_paper.py exits without
# contacting anyone when they are absent.

on:
  schedule:
    - cron: "30 0 * * 2-6"    # 00:30 UTC Tue-Sat: after the US close, inside the OPG window
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-account
  cancel-in-progress: false

jobs:
  trade:
    if: github.repository == 'Olivesz/kronos-quant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide and submit (paper account only)
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: python run_paper.py --submit

      - name: Commit the ledger row
        run: |
          git config user.name "Oliver Zhang"
          git config user.email "oliver.zhang0712@gmail.com"
          git add live/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "paper: ledger row $(date -u +%F) [skip ci]"
            git pull --rebase
            git push
          fi
