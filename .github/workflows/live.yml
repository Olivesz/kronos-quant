name: live-ledger

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays 22:30 UTC, after the US close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-ledger
  cancel-in-progress: false

jobs:
  emit:
    if: github.repository == 'Olivesz/kronos-quant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Emit today's ledger row (strict fetch; failures write GAP rows)
        id: emit
        continue-on-error: true
        run: python run_live.py --emit

      - name: Congruence check (report-only; breaches surface in the log)
        run: python run_live.py --check || true

      - name: Commit the row
        run: |
          git config user.name "oliverz"
          git config user.email "fatpotaato@gmail.com"
          git add live/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "live: ledger row $(date -u +%F) [skip ci]"
            git push
          fi

      - name: Surface emit status (GAP days stay visible as failed runs)
        if: steps.emit.outcome == 'failure'
        run: |
          echo "emit wrote a GAP row (committed above) — marking run red for visibility"
          exit 1
