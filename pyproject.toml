[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kronos-quant"
version = "1.0.0"
description = "Regime-aware quantitative alpha platform and market-microstructure research lab, built from first principles on numpy/pandas/scipy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "oliverz" }]
keywords = [
    "quantitative-finance", "regime-switching", "hidden-markov-model",
    "volatility", "rough-volatility", "hawkes-process", "backtesting",
    "portfolio-optimization", "market-microstructure",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Real Yahoo Finance data path. Omit it and the platform runs end-to-end on a
# seeded synthetic regime-switching market (see KRONOS_SYNTHETIC).
data = ["yfinance>=0.2.40"]
# Development tooling (linting).
dev = ["ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Olivesz/kronos-quant"
Documentation = "https://github.com/Olivesz/kronos-quant/tree/main/docs"

[tool.setuptools]
packages = ["kronos"]
py-modules = ["config"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pragmatic set: pyflakes, pycodestyle, isort, bugbear, comprehensions, pyupgrade.
select = ["E", "F", "I", "B", "C4", "UP"]
# The research code favors terse math; allow ambiguous single-letter names and
# the occasional long formula line that reads better unbroken.
ignore = ["E741", "E501"]
